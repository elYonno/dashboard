<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - elYonno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #0a0c0f;
      --surface:    #10141a;
      --border:     #1e2530;
      --border-hi:  #2e3d50;
      --text:       #c8d8e8;
      --muted:      #556070;
      --accent:     #00e5ff;
      --accent-dim: #00607a;
      --green:      #39ff7e;
      --green-dim:  #1a4a2e;
      --red:        #ff3860;
      --red-dim:    #4a1020;
      --yellow:     #ffcc00;
      --yellow-dim: #4a3800;
      --mono:       'Share Tech Mono', monospace;
      --display:    'Barlow Condensed', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.07) 2px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .logo {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .logo-title {
      font-family: var(--display);
      font-weight: 900;
      font-size: 32px;
      letter-spacing: 6px;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(0,229,255,0.4);
      line-height: 1;
    }

    .logo-sub {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    #conn-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      box-shadow: none;
      transition: all 0.4s;
    }

    .status-dot.online {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2.5s infinite;
    }

    .status-dot.offline {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    #clock {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 28px;
      border-bottom: 1px solid var(--border);
      gap: 16px;
    }

    .toolbar-left {
      display: flex;
      gap: 8px;
    }

    .btn {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 7px 16px;
      border: 1px solid var(--border-hi);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,229,255,0.05);
    }

    .btn:active { transform: scale(0.97); }

    .btn-accent {
      border-color: var(--accent-dim);
      color: var(--accent);
    }

    .btn-accent:hover {
      background: rgba(0,229,255,0.1);
    }

    #summary {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    #summary span { color: var(--text); }

    main {
      padding: 24px 28px;
    }

    #error-banner {
      display: none;
      background: var(--red-dim);
      border: 1px solid var(--red);
      color: var(--red);
      font-size: 12px;
      padding: 10px 16px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    /* App groups */
    #container-grid {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .app-group {}

    .app-group-header {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--display);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .app-group-header .group-name {
      color: var(--accent);
    }

    .app-group-header .group-count {
      flex: 1;
    }

    .app-group-header .btn {
      font-size: 10px;
      padding: 4px 12px;
      letter-spacing: 1px;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    }

    .card:hover {
      border-color: var(--border-hi);
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    .card.running {
      border-color: var(--green-dim);
      box-shadow: inset 0 0 30px rgba(57,255,126,0.03);
    }

    .card.running:hover {
      border-color: var(--green);
      box-shadow: 0 0 16px rgba(57,255,126,0.1);
    }

    .card.stopped {
      border-color: var(--border);
    }

    .card.restarting {
      border-color: var(--yellow-dim);
    }

    .card.partial {
      border-color: var(--yellow-dim);
      box-shadow: inset 0 0 30px rgba(255,204,0,0.03);
    }

    .card.partial:hover {
      border-color: var(--yellow);
      box-shadow: 0 0 16px rgba(255,204,0,0.1);
    }

    /* Corner decorations */
    .card::before {
      content: '';
      position: absolute;
      top: -1px; right: -1px;
      border-top: 12px solid var(--bg);
      border-left: 12px solid transparent;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .card-name {
      font-family: var(--display);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      line-height: 1.1;
    }

    .card-image {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.5px;
    }

    .state-badge {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 10px;
      border: 1px solid;
      clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
    }

    .state-badge.running {
      color: var(--green);
      border-color: var(--green);
      background: rgba(57,255,126,0.08);
      text-shadow: 0 0 8px var(--green);
    }

    .state-badge.exited, .state-badge.stopped {
      color: var(--muted);
      border-color: var(--border-hi);
      background: transparent;
    }

    .state-badge.restarting {
      color: var(--yellow);
      border-color: var(--yellow);
      background: rgba(255,204,0,0.08);
    }

    .state-badge.paused {
      color: var(--yellow);
      border-color: var(--yellow);
    }

    .state-badge.partial {
      color: var(--yellow);
      border-color: var(--yellow);
      background: rgba(255,204,0,0.08);
    }

    .card-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .meta-item {
      background: rgba(0,0,0,0.2);
      padding: 8px 10px;
      border: 1px solid var(--border);
    }

    .meta-label {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .meta-value {
      font-size: 11px;
      color: var(--text);
      word-break: break-all;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .card-actions .btn {
      flex: 1;
      font-size: 10px;
      padding: 7px 8px;
      text-align: center;
    }

    .btn-start {
      border-color: var(--green-dim);
      color: var(--green);
    }
    .btn-start:hover { background: rgba(57,255,126,0.08); border-color: var(--green); }

    .btn-stop {
      border-color: var(--red-dim);
      color: var(--red);
    }
    .btn-stop:hover { background: rgba(255,56,96,0.08); border-color: var(--red); }

    .btn-restart {
      border-color: var(--yellow-dim);
      color: var(--yellow);
    }
    .btn-restart:hover { background: rgba(255,204,0,0.08); border-color: var(--yellow); }

    .btn-logs {
      border-color: var(--border-hi);
      color: var(--muted);
    }
    .btn-logs:hover { border-color: var(--accent); color: var(--accent); }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Spinner on buttons */
    .btn.loading::after {
      content: ' ···';
      animation: dots 1s steps(3, end) infinite;
    }

    @keyframes dots {
      0%   { content: ' ·  '; }
      33%  { content: ' ·· '; }
      66%  { content: ' ···'; }
    }

    /* Per-card stats */
    .card-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .card-stat {
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .cstat-label {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .cstat-track {
      height: 3px;
      background: var(--border);
      overflow: hidden;
    }

    .cstat-fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width 0.6s ease, background 0.4s;
    }

    .cstat-value {
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .cstat-value.warn   { color: var(--yellow); }
    .cstat-value.danger { color: var(--red); }

    /* Logs modal */
    #logs-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #logs-modal.open { display: flex; }

    .logs-panel {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      width: 100%;
      max-width: 820px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    }

    .logs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }

    .logs-title {
      font-family: var(--display);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
    }

    #logs-close {
      font-family: var(--mono);
      font-size: 18px;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0 6px;
      line-height: 1;
    }
    #logs-close:hover { color: var(--red); }

    #logs-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      font-size: 11px;
      line-height: 1.7;
      color: #8fa8b8;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #logs-content::-webkit-scrollbar { width: 6px; }
    #logs-content::-webkit-scrollbar-track { background: var(--bg); }
    #logs-content::-webkit-scrollbar-thumb { background: var(--border-hi); }

    /* Empty / loading states */
    .state-message {
      text-align: center;
      padding: 64px 20px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 2px;
      grid-column: 1 / -1;
    }

    .state-message .big {
      font-family: var(--display);
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--border-hi);
      margin-bottom: 12px;
    }

    /* Notification toast */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--surface);
      border: 1px solid var(--border-hi);
      padding: 12px 20px;
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--text);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s;
      pointer-events: none;
      z-index: 2000;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    #toast.success { border-color: var(--green); color: var(--green); }
    #toast.error   { border-color: var(--red); color: var(--red); }

    /* Docker stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0;
      padding: 10px 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.15);
    }

    .stats-bar-title {
      font-family: var(--display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-right: 24px;
      white-space: nowrap;
    }

    .stat-block {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      border-left: 1px solid var(--border);
    }

    .stat-label {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .stat-track {
      width: 60px;
      height: 4px;
      background: var(--border);
      overflow: hidden;
    }

    .stat-fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width 0.6s ease, background 0.4s;
    }

    .stat-value {
      font-size: 12px;
      color: var(--accent);
      text-shadow: 0 0 8px rgba(0,229,255,0.35);
      white-space: nowrap;
      min-width: 6ch;
    }

    .stat-value.warn  { color: var(--yellow); text-shadow: 0 0 8px rgba(255,204,0,0.35); }
    .stat-value.danger { color: var(--red);   text-shadow: 0 0 8px rgba(255,56,96,0.35); }

    /* Responsive */
    @media (max-width: 600px) {
      header { padding: 14px 16px; flex-direction: column; align-items: flex-start; gap: 10px; }
      .logo-title { font-size: 26px; }
      main { padding: 16px; }
      .toolbar { padding: 10px 16px; }
      .stats-bar { padding: 8px 16px; }
      .stat-block { padding: 0 12px; }
      #container-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-title">elYonno</div>
    <div class="logo-sub">Dashboard</div>
  </div>
  <div class="header-right">
    <div id="conn-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">CHECKING...</span>
    </div>
    <div id="clock"></div>
  </div>
</header>

<div class="stats-bar">
  <div class="stats-bar-title">Docker Stats</div>
  <div class="stat-block">
    <span class="stat-label">CPU</span>
    <div class="stat-track"><div class="stat-fill" id="cpu-fill"></div></div>
    <span class="stat-value" id="stat-cpu">—</span>
  </div>
  <div class="stat-block">
    <span class="stat-label">Memory</span>
    <div class="stat-track"><div class="stat-fill" id="mem-fill"></div></div>
    <span class="stat-value" id="stat-mem">—</span>
  </div>
  <div class="stat-block">
    <span class="stat-label">Containers</span>
    <span class="stat-value" id="stat-containers">—</span>
  </div>
</div>

<div class="toolbar">
  <div class="toolbar-left">
    <button class="btn btn-accent" onclick="refreshAll()">↻ REFRESH</button>
    <button class="btn btn-start" onclick="globalAction('start')">▶ START ALL</button>
    <button class="btn btn-stop" onclick="globalAction('stop')">■ STOP ALL</button>
  </div>
  <div id="summary">Loading...</div>
</div>

<main>
  <div id="error-banner"></div>
  <div id="container-grid">
    <div class="state-message">
      <div class="big">SCANNING</div>
      Connecting to TrueNAS...
    </div>
  </div>
</main>

<div id="logs-modal">
  <div class="logs-panel">
    <div class="logs-header">
      <div class="logs-title" id="logs-title">LOGS</div>
      <button id="logs-close" onclick="closeLogs()">✕</button>
    </div>
    <div id="logs-content"></div>
  </div>
</div>

<div id="toast"></div>

<script>
  let apps = [];
  let refreshTimer = null;
  let statsData = {}; // byContainer map from last /api/stats response

  // --- Clock ---
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB');
  }
  setInterval(updateClock, 1000);
  updateClock();

  // --- Toast ---
  function showToast(msg, type = 'info') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show ' + type;
    clearTimeout(el._timer);
    el._timer = setTimeout(() => { el.className = ''; }, 3000);
  }

  // --- Error banner ---
  function showError(msg) {
    const el = document.getElementById('error-banner');
    el.textContent = '⚠ ' + msg;
    el.style.display = 'block';
  }
  function clearError() {
    document.getElementById('error-banner').style.display = 'none';
  }

  // --- API helpers ---
  async function apiFetch(url, options = {}) {
    const res = await fetch(url, options);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  // --- Health check ---
  async function checkHealth() {
    try {
      const data = await apiFetch('/api/health');
      const dot = document.getElementById('status-dot');
      const txt = document.getElementById('status-text');
      if (data.connected) {
        dot.className = 'status-dot online';
        txt.textContent = `CONNECTED · ${data.host}`;
      } else {
        dot.className = 'status-dot offline';
        txt.textContent = 'DISCONNECTED';
      }
    } catch {
      document.getElementById('status-dot').className = 'status-dot offline';
      document.getElementById('status-text').textContent = 'UNREACHABLE';
    }
  }

  // --- Fetch & render ---
  async function refreshAll() {
    clearError();
    try {
      const data = await apiFetch('/api/apps');
      apps = data.apps || [];
      renderGrid();
      updateSummary();
    } catch (err) {
      showError(err.message);
      document.getElementById('container-grid').innerHTML =
        `<div class="state-message"><div class="big">ERROR</div>${err.message}</div>`;
    }
    checkHealth();
  }

  function updateSummary() {
    let running = 0, total = 0;
    for (const app of apps) {
      for (const svc of app.services || []) {
        total++;
        if (svc.state === 'running') running++;
      }
    }
    document.getElementById('summary').innerHTML =
      `<span>${running}</span> running · <span>${total}</span> total`;
  }

  function serviceCardHtml(appName, svc) {
    const isRunning = svc.state === 'running';
    const isStopped = svc.state === 'stopped';
    const stateClass = svc.state || 'stopped';
    const cardId = `card-${CSS.escape(appName + '/' + svc.name)}`;

    return `
      <div class="card ${stateClass}" id="${cardId}">
        <div class="card-header">
          <div>
            <div class="card-name">${escHtml(svc.name)}</div>
          </div>
          <div class="state-badge ${stateClass}">${escHtml(svc.state || 'unknown')}</div>
        </div>
        <div class="card-meta">
          <div class="meta-item" style="grid-column: 1/-1">
            <div class="meta-label">Status</div>
            <div class="meta-value">${escHtml(svc.status || '—')}</div>
          </div>
        </div>
        <div class="card-stats" data-container="${escHtml(svc.containerName || '')}" data-app="${escHtml(appName)}" data-svc="${escHtml(svc.name)}">
          <div class="card-stat">
            <span class="cstat-label">CPU</span>
            <div class="cstat-track"><div class="cstat-fill"></div></div>
            <span class="cstat-value">—</span>
          </div>
          <div class="card-stat">
            <span class="cstat-label">Memory</span>
            <div class="cstat-track"><div class="cstat-fill"></div></div>
            <span class="cstat-value">—</span>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn btn-start"
            onclick="serviceAction('start','${escHtml(appName)}','${escHtml(svc.name)}')"
            ${isRunning ? 'disabled' : ''}>▶ START</button>
          <button class="btn btn-stop"
            onclick="serviceAction('stop','${escHtml(appName)}','${escHtml(svc.name)}')"
            ${isStopped ? 'disabled' : ''}>■ STOP</button>
          <button class="btn btn-logs"
            onclick="openLogs('${escHtml(appName)}','${escHtml(svc.name)}')">≡ LOGS</button>
        </div>
      </div>
    `;
  }

  function renderGrid() {
    const grid = document.getElementById('container-grid');
    if (apps.length === 0) {
      grid.innerHTML = `<div class="state-message"><div class="big">EMPTY</div>No compose apps found in directory.</div>`;
      return;
    }

    grid.innerHTML = apps.map(app => {
      const running = (app.services || []).filter(s => s.state === 'running').length;
      const total = (app.services || []).length;
      const allRunning = running === total && total > 0;
      const allStopped = running === 0;
      const cards = (app.services || []).map(svc => serviceCardHtml(app.name, svc)).join('');
      return `
        <div class="app-group">
          <div class="app-group-header">
            <span class="group-name">${escHtml(app.name)}</span>
            <span class="group-count">${running}/${total} running</span>
            <button class="btn btn-start" onclick="groupAction('start','${escHtml(app.name)}')"
              ${allRunning ? 'disabled' : ''}>▶ START ALL</button>
            <button class="btn btn-stop" onclick="groupAction('stop','${escHtml(app.name)}')"
              ${allStopped ? 'disabled' : ''}>■ STOP ALL</button>
          </div>
          <div class="service-grid">${cards}</div>
        </div>
      `;
    }).join('');
    updateCardStats();
  }

  // --- Global start/stop all apps ---
  async function globalAction(action) {
    const btns = document.querySelectorAll('.toolbar-left .btn, .app-group-header .btn, .card-actions .btn');
    btns.forEach(b => b.disabled = true);
    try {
      const data = await apiFetch(`/api/${action}-all`, { method: 'POST' });
      showToast(data.message || `${action} all OK`, 'success');
      setTimeout(refreshAll, 1000);
    } catch (err) {
      showToast(`${action} all failed: ${err.message}`, 'error');
      btns.forEach(b => b.disabled = false);
    }
  }

  // --- Group start/stop (all services in one app) ---
  async function groupAction(action, appName) {
    const group = [...document.querySelectorAll('.app-group')]
      .find(g => g.querySelector('.group-name')?.textContent === appName);
    const btns = group ? group.querySelectorAll('.app-group-header .btn, .card-actions .btn') : [];
    btns.forEach(b => b.disabled = true);
    try {
      const data = await apiFetch(`/api/apps/${encodeURIComponent(appName)}/${action}`, { method: 'POST' });
      showToast(data.message || `${action} OK`, 'success');
      setTimeout(refreshAll, 800);
    } catch (err) {
      showToast(`${action} failed: ${err.message}`, 'error');
      btns.forEach(b => b.disabled = false);
    }
  }

  // --- Service actions ---
  async function serviceAction(action, appName, service) {
    const cardId = 'card-' + CSS.escape(appName + '/' + service);
    const card = document.getElementById(cardId);
    const btns = card ? card.querySelectorAll('.card-actions .btn') : [];
    btns.forEach(b => b.disabled = true);

    try {
      const url = `/api/apps/${encodeURIComponent(appName)}/services/${encodeURIComponent(service)}/${action}`;
      const data = await apiFetch(url, { method: 'POST' });
      showToast(data.message || `${action} OK`, 'success');
      setTimeout(refreshAll, 800);
    } catch (err) {
      showToast(`${action} failed: ${err.message}`, 'error');
      btns.forEach(b => b.disabled = false);
    }
  }

  // --- Logs ---
  async function openLogs(appName, service) {
    document.getElementById('logs-title').textContent = `LOGS · ${appName} / ${service}`;
    document.getElementById('logs-content').textContent = 'Fetching logs…';
    document.getElementById('logs-modal').classList.add('open');
    try {
      const url = `/api/apps/${encodeURIComponent(appName)}/services/${encodeURIComponent(service)}/logs?lines=80`;
      const data = await apiFetch(url);
      document.getElementById('logs-content').textContent = data.logs || '(empty)';
      const content = document.getElementById('logs-content');
      content.scrollTop = content.scrollHeight;
    } catch (err) {
      document.getElementById('logs-content').textContent = 'Error: ' + err.message;
    }
  }

  function closeLogs() {
    document.getElementById('logs-modal').classList.remove('open');
  }

  document.getElementById('logs-modal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('logs-modal')) closeLogs();
  });

  // --- Helpers ---
  function escHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // --- Docker stats ---

  function findContainerStats(containerName, appName, svcName) {
    // Direct lookup using the name docker compose ps reported
    if (containerName && statsData[containerName]) return statsData[containerName];

    // Fallback: pattern-based guessing for containers not yet started
    const app = appName.toLowerCase();
    const svc = svcName.toLowerCase();
    const candidates = [
      `${app}-${svc}-1`, `${app}_${svc}_1`,
      `${app}-${svc}`,   `${app}_${svc}`,
      `${svc}-1`,        `${svc}_1`,
    ];
    for (const c of candidates) {
      if (statsData[c]) return statsData[c];
    }
    const p1 = `${app}-${svc}`, p2 = `${app}_${svc}`;
    for (const [k, v] of Object.entries(statsData)) {
      if (k.startsWith(p1) || k.startsWith(p2)) return v;
    }
    return null;
  }

  function applyStatsColor(fillEl, valueEl, pct) {
    const color = pct > 85 ? 'var(--red)' : pct > 60 ? 'var(--yellow)' : 'var(--green)';
    fillEl.style.width = Math.min(pct, 100) + '%';
    fillEl.style.background = color;
    valueEl.className = 'cstat-value' + (pct > 85 ? ' danger' : pct > 60 ? ' warn' : '');
  }

  function updateCardStats() {
    document.querySelectorAll('.card-stats').forEach(el => {
      const s = findContainerStats(el.dataset.container, el.dataset.app, el.dataset.svc);
      if (!s) return;
      const [cpuFill, memFill] = el.querySelectorAll('.cstat-fill');
      const [cpuVal, memVal]   = el.querySelectorAll('.cstat-value');
      cpuVal.textContent = s.cpu.toFixed(1) + '%';
      memVal.textContent = s.memMB + ' MB (' + s.memPct.toFixed(1) + '%)';
      applyStatsColor(cpuFill, cpuVal, s.cpu);
      applyStatsColor(memFill, memVal, s.memPct);
    });
  }

  async function fetchStats() {
    try {
      const data = await apiFetch('/api/stats');
      statsData = data.byContainer || {};

      // top-bar aggregates
      const cpuEl = document.getElementById('stat-cpu');
      const memEl = document.getElementById('stat-mem');
      document.getElementById('stat-containers').textContent = data.containers;

      cpuEl.textContent = data.cpu.toFixed(1) + '%';
      memEl.textContent = data.memMB + ' MB (' + data.memPct.toFixed(1) + '%)';

      const level     = (pct) => pct > 85 ? 'danger' : pct > 60 ? 'warn' : '';
      const fillColor = (pct) => pct > 85 ? 'var(--red)' : pct > 60 ? 'var(--yellow)' : 'var(--green)';
      cpuEl.className = 'stat-value ' + level(data.cpu);
      memEl.className = 'stat-value ' + level(data.memPct);
      const cpuFill = document.getElementById('cpu-fill');
      const memFill = document.getElementById('mem-fill');
      cpuFill.style.width = Math.min(data.cpu, 100) + '%';
      cpuFill.style.background = fillColor(data.cpu);
      memFill.style.width = Math.min(data.memPct, 100) + '%';
      memFill.style.background = fillColor(data.memPct);

      // per-card stats
      updateCardStats();
    } catch {
      document.getElementById('stat-cpu').textContent = 'ERR';
      document.getElementById('stat-mem').textContent = 'ERR';
    }
  }

  // --- Auto-refresh every 15 s ---
  function scheduleRefresh() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => {
      refreshAll().then(scheduleRefresh);
    }, 15000);
  }

  // --- Init ---
  refreshAll().then(scheduleRefresh);
  setInterval(checkHealth, 30000);
  fetchStats();
  setInterval(fetchStats, 10000);
</script>
</body>
</html>
